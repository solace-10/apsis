[package]
name = "apsis-scaleway-serverless-functions"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11"
http = "1.4.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }

[lib]
name = "function"
path = "src/lib.rs"

[[bin]]
name = "local"
path = "src/main.rs"
required-features = ["local-deployment"]

[features]
local-deployment = ["dep:tokio"]
